[package]
name = "plugumi-environment"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plugumi-environment"
path = "src/cli.rs"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
